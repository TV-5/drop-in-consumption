name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      # No secrets are needed: email tests use a fake mail server and a temporary delivery log.
      - name: Test with coverage
        run: python -m pytest --cov=src --cov=sample_data --cov-report=term-missing --cov-fail-under=90
