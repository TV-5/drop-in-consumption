[pytest]
testpaths = tests
pythonpath = .
# Short output by default: one line per file, short tracebacks (keeps logs small for people and agents)
addopts = -q --tb=short
markers =
    integration: tests that run several modules together (pipeline flows, email with a fake mail server)
    app: slow tests that drive the Streamlit app with AppTest; skip with -m "not app"
filterwarnings =
    ignore::DeprecationWarning
